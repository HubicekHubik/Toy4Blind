# --- Serial comunication Configuration ---
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# --- Hardware Pheripherals Configuration ---
CONFIG_I2S=y
CONFIG_PWM=y
CONFIG_GPIO=y
# Enable accel sensor
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL_TRIGGER_OWN_THREAD=y

#Analog reading for battery charging measurrements    
CONFIG_ADC=y
CONFIG_NRFX_SAADC=y

# --- Edge Impulse Configuration ---
#C++ dependencies
CONFIG_CPP=y
CONFIG_STD_CPP11=y
CONFIG_FP16=n

# Enable Edge Impulse
CONFIG_EDGE_IMPULSE=y
CONFIG_EDGE_IMPULSE_DOWNLOAD_ALWAYS=n
CONFIG_EDGE_IMPULSE_URI="xiaog5v46"
CONFIG_EI_WRAPPER=y

CONFIG_EI_WRAPPER_DATA_BUF_SIZE=5000
# --- Storage & Filesystem Configuration ---
#nvs storage
CONFIG_FLASH=y
CONFIG_NVS=y
CONFIG_REBOOT=n
CONFIG_MPU_ALLOW_FLASH_WRITE=y
#sdhc config
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_DISK_ACCESS=y
# Zapnutí podpory dlouhých názvů (Long File Names)
CONFIG_FS_FATFS_LFN=y

# Maximální délka názvu (255 je standard pro Windows/Android)
CONFIG_FS_FATFS_MAX_LFN=255

# --- Bluetooth (BLE) Configuration ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Toy_BLE"
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_GATT_CLIENT=y

CONFIG_BT_LL_SOFTDEVICE=y

CONFIG_BT_BUF_EVT_RX_COUNT=30

CONFIG_BT_BUF_ACL_RX_COUNT=24

CONFIG_BT_BUF_ACL_TX_COUNT=24
CONFIG_BT_CONN_TX_MAX=24
CONFIG_BT_L2CAP_TX_BUF_COUNT=24

# Data Length a MTU
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=4000

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_BUFFER_SIZE=10000
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4048

CONFIG_ENTROPY_GENERATOR=y
CONFIG_DK_LIBRARY=y
