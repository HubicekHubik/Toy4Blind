# --- Bluetooth (BLE) Only Configuration ---
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="ToyRemote_BLE"
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_NUS_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# --- Error handling ---
CONFIG_REBOOT=y
CONFIG_RESET_ON_FATAL_ERROR=y

# Use the standard SoftDevice controller
CONFIG_BT_LL_SOFTDEVICE=y

# Bluetooth Tuning for Data/Files
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

CONFIG_DK_LIBRARY=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_BUFFER_SIZE=2500
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4048
CONFIG_MAIN_STACK_SIZE=4048
CONFIG_ADC=y
CONFIG_PWM=y

CONFIG_CBPRINTF_NANO=n
CONFIG_CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_BT_LOG_SNIFFER_INFO=y